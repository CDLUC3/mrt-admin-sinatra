name: Rubocop

on: [push, pull_request]

jobs:
  rubocop:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repo
    - uses: actions/checkout@v3

    - name: 'remove .bundle/config'
      run: rm .bundle/config

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
        bundler-cache: true
      env:
        # zookeeper gem 1.5.5 bundles C code that fails to build with -Werror on newer gcc
        CFLAGS: -Wno-error

    - name: 'Run Rubocop'
      run: bundle exec rubocop
